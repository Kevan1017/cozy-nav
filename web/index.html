<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 不再加载 Google Fonts（外网请求在国内移动端极慢），改用系统字体 fallback 链 -->
    <title>悦行</title>

    <!-- 主题预加载：页面渲染前根据 localStorage 立即设置正确的主题，避免亮→暗闪烁 -->
    <script>
      (function () {
        var theme = localStorage.getItem('theme') || 'auto';
        var isDark;
        if (theme === 'dark') {
          isDark = true;
        } else if (theme === 'light') {
          isDark = false;
        } else {
          // auto: 19:00-07:00 暗色
          var h = new Date().getHours();
          isDark = h >= 19 || h < 7;
        }
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- 站点标题预加载：首帧前根据 localStorage 设置标题，避免先显示默认"悦行"再切换的闪烁 -->
    <script>
      (function () {
        var t = localStorage.getItem('siteTitle');
        if (t) document.title = t;
      })();
    </script>
    <style>
      /* 首屏背景：根据预加载的 dark 类切换，避免闪烁 */
      /* 使用 CSS 变量，Vue 加载后由预设注入的 --bg 接管 */
      html, body {
        background: var(--bg, #FAF6F0);
      }
      html.dark, html.dark body {
        background: var(--bg, #1A1410);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
